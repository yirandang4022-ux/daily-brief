<style>
/* Layout: a morning wire. Masthead with world clocks, a "today's three" strip, a week agenda, then one column of regional desks; a fixed audio bar reads the whole brief aloud. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#121a24; --muted:#586474; --rule:#d3dae2;
  --accent:#2448b8; --accent-soft:#e3e9fb; --onair:#b97a06; --onair-soft:#fbf0d9;
  --ctx:#f4f6f9;
  --f-display:"Noto Serif SC","Songti SC","SimSun",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --surface:#17202a; --ink:#e6ebf1; --muted:#93a1b1; --rule:#273341;
  --accent:#88a3ff; --accent-soft:#1e2a4a; --onair:#f0b43c; --onair-soft:#3a2d12; --ctx:#121a22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#17202a; --ink:#e6ebf1; --muted:#93a1b1; --rule:#273341;
  --accent:#88a3ff; --accent-soft:#1e2a4a; --onair:#f0b43c; --onair-soft:#3a2d12; --ctx:#121a22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:780px;margin:0 auto;padding-block:28px 24px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* masthead */
.mast{display:grid;gap:14px;border-bottom:3px solid var(--ink);padding-bottom:16px}
.mast h1{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,7vw,52px);line-height:1.05;margin:0;letter-spacing:.02em}
.mast h1 span{font-family:var(--f-mono);font-weight:600;font-size:.42em;letter-spacing:.12em;color:var(--accent);vertical-align:.55em;margin-left:.4em}
.dateline{font-family:var(--f-mono);font-size:13px;color:var(--muted);letter-spacing:.04em}
.clocks{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.clocks b{color:var(--ink);font-weight:600}

/* top three */
.top{margin-top:18px;display:grid;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.top ol{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:t}
.top li{counter-increment:t;display:grid;grid-template-columns:2.2em 1fr;gap:4px;font-size:17px;line-height:1.6}
.top li::before{content:counter(t);font-family:var(--f-display);font-weight:900;font-size:26px;line-height:1.1;color:var(--accent)}

/* agenda */
.agenda{margin-top:22px;background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:14px 16px}
.agenda table{width:100%;border-collapse:collapse;font-size:14px}
.agenda td{padding:5px 0;vertical-align:top;border-top:1px dashed var(--rule)}
.agenda tr:first-child td{border-top:0}
.agenda td.d{font-family:var(--f-mono);white-space:nowrap;padding-right:14px;color:var(--accent);font-variant-numeric:tabular-nums;width:1%}
.agenda .today td.d::after{content:"";color:var(--onair);font-family:var(--f-body);font-weight:700}

/* sections */
nav.toc{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);border-bottom:1px solid var(--rule);
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:10px;margin-top:0}
nav.toc::-webkit-scrollbar{display:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--bg)}
.chip{flex:0 0 auto;display:inline-flex;align-items:stretch;border:1px solid var(--rule);background:var(--surface);border-radius:999px;overflow:hidden}
.chip a{font-size:14px;text-decoration:none;color:var(--ink);padding:5px 6px 5px 12px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip a small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chip a:only-child{padding-right:12px}
.chip a{padding-right:12px}
.player audio{flex:1 1 260px;min-width:0;width:100%;height:40px}
.pl-label{font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap}
.pod-lang{display:inline-flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden;flex:0 0 auto}
.pod-lang button{font:500 13px var(--f-body);background:transparent;color:var(--ink);border:0;padding:3px 10px;cursor:pointer}
.pod-lang button+button{border-left:1px solid var(--ink)}
.pod-lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip button{border:0;border-left:1px solid var(--rule);background:transparent;color:var(--accent);font-size:12px;padding:0 10px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip button:hover,.chip.on button{background:var(--accent);color:var(--surface)}
.chip.on{border-color:var(--accent)}
section.desk,#highlights{scroll-margin-top:72px}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
section.desk{margin-top:38px}
.desk-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding-bottom:6px}
.desk-head h2{font-family:var(--f-display);font-weight:900;font-size:26px;margin:0;letter-spacing:.03em}
.desk-head h2 small{font-family:var(--f-mono);font-weight:400;font-size:12.5px;color:var(--muted);letter-spacing:.08em;margin-left:10px}
.desk-head .meta{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn-mini{font:500 13px var(--f-body);border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:999px;padding:2px 10px;cursor:pointer}
.btn-mini:hover{border-color:var(--accent);color:var(--accent)}

article.item{padding:18px 0 20px;border-bottom:1px solid var(--rule);display:grid;gap:8px;scroll-margin-top:72px;transition:background .2s}
article.item.reading{background:var(--onair-soft);box-shadow:-10px 0 0 var(--onair-soft),10px 0 0 var(--onair-soft)}
article.item h3{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.45;margin:0;text-wrap:balance}
article.item .en{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);line-height:1.5}
article.item p{margin:0;max-width:65ch}
.ctx{background:var(--ctx);border-left:3px solid var(--accent);padding:10px 14px;font-size:15px;color:var(--ink);max-width:65ch}
.ctx .lab{display:block;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;color:var(--accent);margin-bottom:2px}
.why{font-size:15px;color:var(--muted)}
.why b{color:var(--ink);font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-family:var(--f-mono);font-size:12px;background:var(--accent-soft);color:var(--accent);padding:1px 8px;border-radius:3px}
.src{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.src a{text-decoration:none;border-bottom:1px solid currentColor}

/* holidays */
.cult-list{display:grid;gap:0}
.hol{display:grid;grid-template-columns:6.4em 1fr;gap:4px 14px;padding:14px 0;border-bottom:1px solid var(--rule);scroll-margin-top:72px;transition:background .2s}
.hol.reading{background:var(--onair-soft);box-shadow:-10px 0 0 var(--onair-soft),10px 0 0 var(--onair-soft)}
.hol .when{font-family:var(--f-mono);font-size:13px;color:var(--accent);line-height:1.35;font-variant-numeric:tabular-nums}
.hol .when small{display:block;color:var(--muted);font-size:11.5px}
.hol .when .soon{color:var(--onair);font-weight:600}
.hol .what{min-width:0;display:grid;gap:6px}
.hol .name{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.4;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.hol .name .alt{font-family:var(--f-mono);font-weight:400;font-size:12px;color:var(--muted)}
.hol .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cc{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--rule);color:var(--muted);padding:0 6px;border-radius:3px}
.off{font-size:12px;font-weight:600;color:var(--onair);background:var(--onair-soft);padding:0 8px;border-radius:3px}
.hol p{margin:0;max-width:65ch;font-size:15px}
.hol .tip{font-size:14px;color:var(--muted);max-width:65ch}
.hol .tip b{color:var(--ink);font-weight:500}
@media (max-width:480px){.hol{grid-template-columns:1fr}.hol .when small{display:inline;margin-left:6px}}
footer{margin-top:40px;font-size:13px;color:var(--muted);max-width:65ch}

/* player */
.player{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--rule);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.player-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.play{font:700 15px var(--f-body);background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:8px 18px;cursor:pointer;min-width:7.5em}
.play.on{background:var(--onair);color:#1a1205}
.stop{font:500 14px var(--f-body);background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:999px;padding:7px 14px;cursor:pointer}
.player select{font:14px var(--f-body);background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:5px 6px}
.now{flex:1 1 200px;min-width:0;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now b{color:var(--onair)}
.mast-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lang{display:inline-flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{font:500 13px var(--f-body);background:transparent;color:var(--ink);border:0;padding:3px 12px;cursor:pointer}
.lang button+button{border-left:1px solid var(--ink)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.en-line{display:block}
.sub{color:var(--muted);font-size:.92em}
.en-p{max-width:65ch;line-height:1.65}
p.en-p{margin:0}
.ctx .en-p.sub{margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule)}
.why .en-p.sub{margin-top:2px}
.top li .sub{font-size:15px;margin-top:2px}
.agenda .today td.d::after{content:attr(data-today)}
.agenda td .sub{font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:480px){.desk-head h2{font-size:22px} article.item h3{font-size:18px}}
</style>
